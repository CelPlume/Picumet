name = "picumet-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "00000000000000000000000000000000"

[vars]
ENVIRONMENT = "development"
APP_BASE_URL = "http://localhost:5173"
# 允许的 CORS 来源（逗号分隔）
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "picumet-db"
database_id = "local-picumet-db-0000000000000000000000"
migrations_dir = "migrations"

# KV 存储
[[kv_namespaces]]
binding = "KV"
id = "local-picumet-kv-0000000000000000000000"

# R2 存储桶
[[r2_buckets]]
binding = "R2"
bucket_name = "picumet-storage"
preview_bucket_name = "picumet-storage"

# 审计日志冷归档桶（可选）。创建 R2 桶后取消注释即启用：
# 超保留期（system_settings.audit_retention_days，默认 90 天）的整小时审计窗口导出 NDJSON.gz 到此桶。
# 未配置 = 归档任务整体跳过（只读不删，D1 热行不会因归档缺失被清理）。
# [[r2_buckets]]
# binding = "AUDIT_BUCKET"
# bucket_name = "picumet-audit"

# 定时任务：过期上传预留释放（含 multipart abort）、内容对象回收（§F 保护期后删除）、孤立对象与内容索引对账、
# 分享过期标记、审计日志冷归档
[triggers]
crons = ["*/10 * * * *"]
